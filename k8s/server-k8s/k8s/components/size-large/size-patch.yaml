# Large profile: CPU/memory to match the DBmarlin hardware requirements.
# Disk is NOT set here - size the PVC yourself in base/pvc.yaml (the deploy
# script warns if it is below the recommendation for this profile).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dbmarlin-server
spec:
  template:
    spec:
      initContainers:
      - name: dbmarlin-copy
        env:
        - name: DBMARLIN_SIZE
          value: Large
      containers:
      - name: dbmarlin-server
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "4"
            memory: 16Gi
