# NodePort avoids the cost of a cloud load balancer - useful for test clusters.
# Reach the UI on <any-node-IP>:<allocated-node-port> (kubectl get svc), or with
# no open firewall ports at all via:
#   kubectl port-forward svc/dbmarlin-service 9090:9090
apiVersion: v1
kind: Service
metadata:
  name: dbmarlin-service
spec:
  type: NodePort
