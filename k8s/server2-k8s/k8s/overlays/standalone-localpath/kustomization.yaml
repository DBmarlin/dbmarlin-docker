apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/deployment

patches:
  - path: storageclass-patch.yaml
  - path: image-patch.yaml

configMapGenerator:
  - name: dbmarlin-upgrade-init
    files:
      - dbmarlin-upgrade-init.sh

generatorOptions:
  disableNameSuffixHash: true
